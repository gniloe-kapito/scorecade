<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="scArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#8f7346"/>
      <stop offset="0.55" stop-color="#c0a17a"/>
      <stop offset="1" stop-color="#ecd096"/>
    </linearGradient>
    <linearGradient id="scS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efdd"/>
      <stop offset="1" stop-color="#d8c6a2"/>
    </linearGradient>
    <radialGradient id="scGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c0a17a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c0a17a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- графитовая плашка -->
  <rect width="512" height="512" rx="112" fill="#191b1b"/>
  <rect x="26" y="26" width="460" height="460" rx="88" fill="none" stroke="#c0a17a" stroke-opacity="0.22" stroke-width="5"/>
  <circle cx="256" cy="236" r="238" fill="url(#scGlow)"/>
  <!-- шкала оценки: дуга через верх, как колесо Scorecade -->
  <path d="M 125 348 A 160 160 0 1 1 387 348" fill="none" stroke="url(#scArc)" stroke-width="30" stroke-linecap="round"/>
  <!-- отметка на шкале -->
  <circle cx="387" cy="348" r="23" fill="#ecd096" stroke="#191b1b" stroke-width="11"/>
  <!-- монограмма -->
  <text x="256" y="272" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="252" font-weight="800" fill="url(#scS)">S</text>
</svg>
